version: '3.8'
services:
  jetstream:
    image: jetstream-app
    init: true
    depends_on:
      db:
        condition: service_healthy
      db_seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      ENVIRONMENT: development
      LOG_LEVEL: info
      IS_LOCAL_DOCKER: 'true'
      PRETTY_LOGS: 'true'

      # Database
      JETSTREAM_POSTGRES_DBURI: postgres://postgres:postgres@postgres:5432/postgres

      # URLs
      JETSTREAM_CLIENT_URL: http://localhost:3333/app
      JETSTREAM_SERVER_DOMAIN: localhost:3333
      JETSTREAM_SERVER_URL: http://localhost:3333
      NEXT_PUBLIC_CLIENT_URL: http://localhost:3333/app
      NEXT_PUBLIC_SERVER_URL: http://localhost:3333

      # Example user (bypasses OAuth login for local testing)
      EXAMPLE_USER_OVERRIDE: 'true'
      EXAMPLE_USER_PASSWORD: 'EXAMPLE_123!'

      # Encryption keys (pre-generated for local use only — do NOT use in production)
      JETSTREAM_SESSION_SECRET: 'local-dev-session-secret-do-not-use-in-production-abcdefgh'
      JETSTREAM_AUTH_SECRET: 'local-dev-auth-secret-do-not-use-in-production-abcdefghij'
      JETSTREAM_AUTH_OTP_SECRET: 'local-dev-otp-secret-do-not-use-in-production-abcdefghij'
      JETSTREAM_AUTH_SSO_SECRET: 'local-dev-sso-secret-do-not-use-in-production-abcdefghij'
      JWT_ENCRYPTION_KEY: 'bG9jYWwtZGV2LWp3dC1lbmNyeXB0aW9uLWtleS1hYmNk'
      SFDC_ENCRYPTION_KEY: 'bG9jYWwtZGV2LXNmZGMtZW5jcnlwdGlvbi1rZXktYWJj'
      DESKTOP_ORG_ENCRYPTION_SECRET: 'local-dev-desktop-org-encryption-secret-do-not-use-in-production'

      # Salesforce OAuth (dummy values for local testing with example user)
      # These are read from .env (created by the setup script)
      SFDC_CONSUMER_KEY: ${SFDC_CONSUMER_KEY}
      SFDC_CONSUMER_SECRET: ${SFDC_CONSUMER_SECRET}
      SFDC_CALLBACK_URL: http://localhost:3333/oauth/sfdc/callback
      NX_SFDC_API_VERSION: '63.0'

      # SAML (required but not used locally)
      JETSTREAM_SAML_SP_ENTITY_ID_PREFIX: 'urn:jetstream:local'

    ports:
      - '3333:3333'
  db:
    image: postgres:16.1-alpine
    restart: always
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - PGUSER=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432
    ports:
      - '5555:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 5s
      timeout: 5s
      retries: 5
  db_seed:
    image: jetstream-app
    command: >
      bash -c "yarn db:migrate && yarn db:seed"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      JETSTREAM_POSTGRES_DBURI: postgres://postgres:postgres@postgres:5432/postgres

volumes:
  pgdata:
